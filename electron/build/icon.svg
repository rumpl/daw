<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DAW monogram</title>
  <desc id="desc">A geometric DAW lettermark on a dark rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="150" y1="110" x2="874" y2="914" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20242B"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="mark" x1="205" y1="320" x2="864" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73B5FF"/>
      <stop offset="0.5" stop-color="#4384FF"/>
      <stop offset="1" stop-color="#8C70FF"/>
    </linearGradient>
    <filter id="shadow" x="54" y="66" width="916" height="922" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="100" y="92" width="824" height="824" rx="190" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101" y="93" width="822" height="822" rx="189" fill="none" stroke="#FFF" stroke-opacity="0.09" stroke-width="2"/>

  <g fill="url(#mark)" transform="translate(-40 0)">
    <!-- D -->
    <path fill-rule="evenodd" d="M204 320H298C410 320 462 389 462 510C462 631 410 700 298 700H204V320ZM274 383V637H300C361 637 391 596 391 510C391 424 361 383 300 383H274Z"/>
    <!-- A -->
    <path fill-rule="evenodd" d="M394 700L492 320H564L660 700H588L568 610H485L465 700H394ZM499 548H554L527 420L499 548Z"/>
    <!-- W: two complete valleys with an unobstructed final upstroke -->
    <path d="M625 320H696L730 579L770 408H824L846 579L875 320H944L887 700H816L796 529L755 700H682L625 320Z" transform="translate(-44 0)"/>
  </g>
</svg>
