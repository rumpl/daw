schemaVersion: "2"
kind: sandbox
name: daw-runner
version: "0.1.0"
displayName: Atelier runner
description: Runs the Atelier coding agent API inside a Docker Sandbox.
sourceURL: https://github.com/rumpl/daw

sandbox:
  # The template extends Docker Agent's supported sandbox image and bakes in
  # the large runner binary. sandboxd pulls this layer once and reuses it;
  # keeping the binary out of static kit files avoids copying it into every
  # new sandbox.
  image: __DAW_RUNNER_TEMPLATE__
  # The host starts the runner once through `sbx exec` after sandbox creation.
  # A no-op entrypoint prevents the inherited docker-agent process and avoids
  # the setup.startup credential-proxy launch context.
  entrypoint:
    - /bin/true
  resources:
    cpu: 2
    memory: 4g

# Declare the model credential bindings used by the embedded Docker Agent SDK.
# The real secrets remain in the host keychain; only proxy-managed sentinels are
# exposed to the runner.
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
        - domain: claude.ai
          header: x-api-key
          format: "%s"
        - domain: console.anthropic.com
          header: x-api-key
          format: "%s"
  - service: google
    apiKey:
      name: GOOGLE_API_KEY
      proxyManaged: true
      inject:
        - domain: aiplatform.googleapis.com
          header: x-goog-api-key
          format: "%s"
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: "%s"
        - domain: oauth2.googleapis.com
          header: x-goog-api-key
          format: "%s"
        - domain: vertexai.googleapis.com
          header: x-goog-api-key
          format: "%s"
  - service: mistral
    apiKey:
      name: MISTRAL_API_KEY
      proxyManaged: true
  - service: nebius
    apiKey:
      name: NEBIUS_API_KEY
      proxyManaged: true
  - service: openai
    apiKey:
      name: OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          header: Authorization
          format: Bearer %s
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: Bearer %s
  - service: xai
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true

agentInstructions:
  filename: AGENTS.md
